[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrothermo"
version = "0.1.0"
description = "Species and reaction thermochemistry (Cp, H, S, G, K) from NIST Shomate data, for pyrometallurgy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas>=2",
    "matplotlib>=3.8",
    "ipykernel",
    "nbformat",
    "nbclient",
]
app = [
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrothermo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N802/N803: allow T, Tmin, dH, dG etc. - standard thermodynamic notation.
ignore = ["N802", "N803", "N806", "N815"]

[tool.ruff.lint.per-file-ignores]
# Display strings use real minus signs, en dashes and subscripts on purpose.
"app/*" = ["RUF001"]
"tests/test_app.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "app"]

[[tool.mypy.overrides]]
module = ["plotly.*", "pandas.*", "streamlit.*"]
ignore_missing_imports = true
